spring:
  application:
    name: blog-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL:jdbc:mysql://127.0.0.1:3306/blog_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${BLOG_DB_USERNAME:blog_system}
    password: ${BLOG_DB_PASSWORD:}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    redis:
      host: ${BLOG_REDIS_HOST:127.0.0.1}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: ${BLOG_REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
        keep-alive: 60s
      thread-name-prefix: async-

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: ${SERVER_PORT:8082}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 80
      min-spare: 10

logging:
  level:
    root: info
    com.blog: info
    org.springframework: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: ${BLOG_LOG_FILE:/opt/blog/logs/blog.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30

blog:
  jwt:
    # 请通过环境变量 BLOG_JWT_SECRET 配置至少 32 位的随机字符串
    secret: ${BLOG_JWT_SECRET:replace-with-at-least-32-chars-random-secret}
    expiration: ${BLOG_JWT_EXPIRATION:86400000}

  upload:
    path: ${BLOG_UPLOAD_PATH:/opt/blog/uploads}
    max-size: 10485760
    url-prefix: /uploads

  site:
    url: ${BLOG_SITE_URL:https://your-domain.com}

  admin:
    username: ${BLOG_ADMIN_USERNAME:admin}
    password: ${BLOG_ADMIN_PASSWORD:}

cos:
  secret-id: ${BLOG_COS_SECRET_ID:}
  secret-key: ${BLOG_COS_SECRET_KEY:}
  region: ${BLOG_COS_REGION:ap-guangzhou}
  bucket-name: ${BLOG_COS_BUCKET_NAME:}
  url-prefix: ${BLOG_COS_URL_PREFIX:}

gitee:
  oauth:
    client-id: ${BLOG_GITEE_CLIENT_ID:}
    client-secret: ${BLOG_GITEE_CLIENT_SECRET:}
    redirect-uri: ${BLOG_GITEE_REDIRECT_URI:https://your-domain.com/oauth/callback}

github:
  oauth:
    client-id: ${BLOG_GITHUB_CLIENT_ID:}
    client-secret: ${BLOG_GITHUB_CLIENT_SECRET:}
    redirect-uri: ${BLOG_GITHUB_REDIRECT_URI:https://your-domain.com/oauth/callback}
